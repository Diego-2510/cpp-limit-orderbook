name: CodeQL

on:
  push:
    branches:
      - main

  pull_request:

  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp

      - name: Configure
        run: >
          cmake
          -S .
          -B build-codeql
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF
          -DORDERBOOK_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: >
          cmake
          --build build-codeql
          --parallel

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4