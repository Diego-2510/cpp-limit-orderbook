name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} build and tests
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DORDERBOOK_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Demo smoke test
        run: ./build/orderbook_demo

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04

    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: >
          cmake
          -S .
          -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DORDERBOOK_ENABLE_SANITIZERS=ON
          -DORDERBOOK_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitized --output-on-failure

      - name: Sanitized demo smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ./build-sanitized/orderbook_demo

  static-analysis:
    name: Format and clang-tidy
    runs-on: ubuntu-24.04

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy

      - name: Check formatting
        run: |
          find include src tests examples benchmarks \
            -type f \( -name '*.h' -o -name '*.cpp' \) \
            -print0 |
          xargs -0 clang-format --dry-run --Werror

      - name: Configure clang-tidy build
        run: >
          cmake
          -S .
          -B build-tidy
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF
          -DORDERBOOK_ENABLE_CLANG_TIDY=ON
          -DORDERBOOK_WARNINGS_AS_ERRORS=ON

      - name: Run clang-tidy
        run: cmake --build build-tidy --parallel
